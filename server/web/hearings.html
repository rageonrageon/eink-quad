<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Hearing Calendar</title>
<style>
  :root { --bg:#f6f5f1; --card:#fff; --ink:#1b1b1b; --mute:#7a7a75; --line:#dcdad2; --accent:#1b1b1b; --ok:#2f7d4f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161614; --card:#222220; --ink:#f1f0ea; --mute:#9a998f; --line:#3a3a36; --accent:#f1f0ea; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--line);
           padding:calc(10px + env(safe-area-inset-top)) 16px 10px; }
  h1 { font-size:19px; margin:0 0 6px; letter-spacing:.02em; }
  .legend { display:flex; gap:16px; align-items:center; font-size:14px; color:var(--mute); flex-wrap:wrap; }
  .legend span { display:inline-flex; align-items:center; gap:6px; }
  .sw { width:18px; height:18px; border-radius:5px; display:inline-block; }
  .sw.p { background:var(--accent); }
  .sw.r { border:2.5px solid var(--accent); }
  #status { margin-left:auto; font-size:13px; }
  #status.err { color:#c0392b; font-weight:600; }
  main { padding:8px 12px calc(40px + env(safe-area-inset-bottom)); max-width:520px; margin:0 auto; }
  .month { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 8px 8px; margin:12px 0; }
  .month h2 { font-size:17px; margin:0 6px 8px; display:flex; justify-content:space-between; align-items:baseline; }
  .month h2 small { font-weight:400; color:var(--mute); font-size:13px; }
  .grid { display:grid; grid-template-columns:repeat(5, 1fr); gap:6px; }
  .dow { text-align:center; font-size:13px; color:var(--mute); padding:2px 0 4px; }
  .day { aspect-ratio:1/1; min-height:56px; border-radius:12px; border:2.5px solid transparent; background:transparent; color:var(--ink);
         font:inherit; font-size:21px; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0; cursor:pointer; position:relative; }
  .day.blank { visibility:hidden; pointer-events:none; }
  .day.past { opacity:.35; pointer-events:none; }
  .day.today { box-shadow:0 0 0 2px var(--line) inset; font-weight:700; }
  .day.p { background:var(--accent); color:var(--bg); font-weight:700; }
  .day.r { border-color:var(--accent); font-weight:700; }
  .day .tag { font-size:11px; letter-spacing:.03em; line-height:1; margin-top:3px; text-transform:uppercase; font-weight:700; }
  .day:active { transform:scale(.94); }
  /* bottom sheet */
  #shade { position:fixed; inset:0; background:rgba(0,0,0,.45); opacity:0; pointer-events:none; transition:opacity .15s; z-index:10; }
  #shade.on { opacity:1; pointer-events:auto; }
  #sheet { position:fixed; left:0; right:0; bottom:0; z-index:11; background:var(--card); border-radius:20px 20px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom));
           transform:translateY(105%); transition:transform .18s ease-out; max-width:520px; margin:0 auto; box-shadow:0 -6px 24px rgba(0,0,0,.25); }
  #sheet.on { transform:none; }
  #sheet h3 { margin:0 0 14px; font-size:20px; text-align:center; }
  .choice { display:block; width:100%; min-height:56px; margin:0 0 10px; border-radius:14px; border:2.5px solid var(--accent); background:transparent; color:var(--ink);
            font:inherit; font-size:18px; font-weight:700; cursor:pointer; }
  .choice.p { background:var(--accent); color:var(--bg); }
  .choice.sel::after { content:"  ✓"; }
  .choice.clear { border-color:var(--line); color:var(--mute); font-weight:500; min-height:48px; }
  .cancel { display:block; margin:4px auto 0; background:none; border:0; color:var(--mute); font:inherit; font-size:16px; padding:10px 20px; cursor:pointer; }
</style>
</head>
<body>
<header>
  <h1>Hearing Calendar</h1>
  <div class="legend">
    <span><i class="sw p"></i> In person</span>
    <span><i class="sw r"></i> Remote</span>
    <span id="status"></span>
  </div>
</header>
<main id="months"></main>

<div id="shade"></div>
<div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <h3 id="sheetTitle"></h3>
  <button class="choice p" data-v="p">In person</button>
  <button class="choice" data-v="r">Remote</button>
  <button class="choice clear" data-v="x">No hearing</button>
  <button class="cancel" id="cancel">Cancel</button>
</div>

<script>
/*API*/
const K = new URLSearchParams(location.search).get('k') || '';
const base = location.pathname.replace(/\/?(index\.html)?$/, '');
async function loadDays() {
  const r = await fetch(`${base.replace(/\/hearings$/, '')}/api/hearing-days?k=${encodeURIComponent(K)}`);
  if (!r.ok) throw new Error('Not authorised');
  return (await r.json()).days;                     // {"2030-01-15": "p" | "r"}  (an example date)
}
async function saveDay(date, v) {                    // v: "p" | "r" | "x" (clear)
  const r = await fetch(`${base.replace(/\/hearings$/, '')}/api/hearing-days?k=${encodeURIComponent(K)}`, {method: 'POST', body: JSON.stringify({date, value: v})});
  if (r.status === 404) throw new Error('Link not valid. Not saved.');
  const j = await r.json(); if (!r.ok) throw new Error(j.error || 'Could not save');
  return j.days;
}
/*END API*/

const MONTHS_AHEAD = 6;                              // this month + the next 6
let days = {}, picked = null;
const $ = (id) => document.getElementById(id);
const iso = (y, m, d) => `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
const today = new Date(); const todayIso = iso(today.getFullYear(), today.getMonth(), today.getDate());

function say(msg, err) { const s = $('status'); s.textContent = msg; s.className = err ? 'err' : ''; }

function build() {
  const box = $('months'); box.innerHTML = '';
  for (let i = 0; i <= MONTHS_AHEAD; i++) {
    const first = new Date(today.getFullYear(), today.getMonth() + i, 1);
    const y = first.getFullYear(), m = first.getMonth();
    const n = new Date(y, m + 1, 0).getDate();
    const sec = document.createElement('section'); sec.className = 'month';
    let cnt = 0; for (let d = 1; d <= n; d++) if (days[iso(y, m, d)] && iso(y, m, d) >= todayIso) cnt++;
    sec.innerHTML = `<h2>${first.toLocaleDateString([], {month: 'long', year: 'numeric'})}<small>${cnt ? cnt + ' hearing day' + (cnt > 1 ? 's' : '') : ''}</small></h2>`;
    const g = document.createElement('div'); g.className = 'grid';
    for (const w of ['Mon', 'Tue', 'Wed', 'Thu', 'Fri']) g.insertAdjacentHTML('beforeend', `<div class="dow">${w}</div>`);
    const f0 = first.getDay();                       // weekends are left out: a month that starts on one begins at the next Monday
    for (let b = 0; b < (f0 === 0 ? 0 : f0 === 6 ? 0 : f0 - 1); b++) g.insertAdjacentHTML('beforeend', '<button class="day blank" tabindex="-1" aria-hidden="true"></button>');
    for (let d = 1; d <= n; d++) {
      const k = iso(y, m, d), dow = new Date(y, m, d).getDay(), v = days[k];
      if (dow === 0 || dow === 6) continue;
      const b = document.createElement('button');
      b.className = 'day' + (k < todayIso ? ' past' : '') + (k === todayIso ? ' today' : '') + (v ? ' ' + v : '');
      b.dataset.date = k;
      b.innerHTML = `${d}${v ? `<span class="tag">${v === 'p' ? 'in person' : 'remote'}</span>` : ''}`;
      b.setAttribute('aria-label', new Date(y, m, d).toLocaleDateString([], {weekday: 'long', month: 'long', day: 'numeric'}) + (v ? (v === 'p' ? ', in person' : ', remote') : ''));
      b.onclick = () => openSheet(k);
      g.appendChild(b);
    }
    sec.appendChild(g); box.appendChild(sec);
  }
}

function openSheet(k) {
  picked = k;
  const d = new Date(k + 'T12:00:00');
  $('sheetTitle').textContent = d.toLocaleDateString([], {weekday: 'long', month: 'long', day: 'numeric'});
  for (const b of document.querySelectorAll('.choice')) b.classList.toggle('sel', b.dataset.v === days[k] || (b.dataset.v === 'x' && !days[k]));
  $('shade').classList.add('on'); $('sheet').classList.add('on');
}
function closeSheet() { $('shade').classList.remove('on'); $('sheet').classList.remove('on'); picked = null; }

async function choose(v) {
  const k = picked; if (!k) return;
  closeSheet();
  if ((days[k] || 'x') === v) return;               // nothing changed
  const before = {...days};
  if (v === 'x') delete days[k]; else days[k] = v;   // show it at once, undo if the server says no
  build(); say('Saving…');
  try { days = await saveDay(k, v); build(); say('Saved'); setTimeout(() => say(''), 1800); }
  catch (e) { days = before; build(); say(e.message || 'Not saved', true); }
}
for (const b of document.querySelectorAll('.choice')) b.onclick = () => choose(b.dataset.v);
$('shade').onclick = closeSheet; $('cancel').onclick = closeSheet;
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });

(async () => {
  try { days = await loadDays(); } catch (e) { say(e.message, true); }
  build();
})();
</script>
</body>
</html>
